name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # RenderWare headers come from plugin-sdk (public repo); we only need the header folder
      - name: Get RenderWare headers
        shell: bash
        run: |
          git clone --depth 1 https://github.com/DK22Pac/plugin-sdk.git psdk
          RWH=$(find psdk -name rwcore.h | head -n 1)
          echo "rwcore.h found at: $RWH"
          if [ -z "$RWH" ]; then echo "rwcore.h not found in plugin-sdk"; exit 1; fi
          echo "RWINC=$(dirname "$RWH")" >> "$GITHUB_ENV"

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86          # GTA SA is 32-bit

      # fxc.exe ships with the Windows SDK, which is on PATH after msvc-dev-cmd
      - name: Compile shaders
        shell: cmd
        run: |
          fxc /nologo /O3 /T vs_3_0 /E VSMain /Vn g_vsQuad                              /Fh src\ssao_vs.h       src\ssao.hlsl || exit /b 1
          fxc /nologo /O3 /T ps_3_0 /E PSAO   /Vn g_psAO0 /D NDIR=3 /D NSTEP=3          /Fh src\ssao_ps_ao0.h   src\ssao.hlsl || exit /b 1
          fxc /nologo /O3 /T ps_3_0 /E PSAO   /Vn g_psAO1 /D NDIR=4 /D NSTEP=4          /Fh src\ssao_ps_ao1.h   src\ssao.hlsl || exit /b 1
          fxc /nologo /O3 /T ps_3_0 /E PSAO   /Vn g_psAO2 /D NDIR=6 /D NSTEP=5          /Fh src\ssao_ps_ao2.h   src\ssao.hlsl || exit /b 1
          fxc /nologo /O3 /T ps_3_0 /E PSBlur /Vn g_psBlur                              /Fh src\ssao_ps_blur.h  src\ssao.hlsl || exit /b 1
          fxc /nologo /O3 /T ps_3_0 /E PSComp /Vn g_psComp                              /Fh src\ssao_ps_comp.h  src\ssao.hlsl || exit /b 1
          fxc /nologo /O3 /T vs_3_0 /E VSMain /Vn g_vsPost                              /Fh src\post_vs.h       src\post.hlsl || exit /b 1
          fxc /nologo /O3 /T ps_3_0 /E PSPost /Vn g_psPost                              /Fh src\post_ps.h       src\post.hlsl || exit /b 1
          rem --- optional SMAA: only when the official files were added to src\ (otherwise FXAA is used) ---
          if exist src\SMAA.hlsl if exist src\AreaTex.h if exist src\SearchTex.h (
            fxc /nologo /O3 /T vs_3_0 /E VSEdge   /Vn g_vsSmaaEdge   /Fh src\smaa_vs_edge.h   src\post_smaa.hlsl || exit /b 1
            fxc /nologo /O3 /T ps_3_0 /E PSEdge   /Vn g_psSmaaEdge   /Fh src\smaa_ps_edge.h   src\post_smaa.hlsl || exit /b 1
            fxc /nologo /O3 /T vs_3_0 /E VSWeight /Vn g_vsSmaaWeight /Fh src\smaa_vs_weight.h src\post_smaa.hlsl || exit /b 1
            fxc /nologo /O3 /T ps_3_0 /E PSWeight /Vn g_psSmaaWeight /Fh src\smaa_ps_weight.h src\post_smaa.hlsl || exit /b 1
            fxc /nologo /O3 /T vs_3_0 /E VSBlend  /Vn g_vsSmaaBlend  /Fh src\smaa_vs_blend.h  src\post_smaa.hlsl || exit /b 1
            fxc /nologo /O3 /T ps_3_0 /E PSBlend  /Vn g_psSmaaBlend  /Fh src\smaa_ps_blend.h  src\post_smaa.hlsl || exit /b 1
          )

      - name: Build dualpass.asi
        shell: cmd
        run: cl /nologo /LD /O2 /MT /Zc:threadSafeInit- /I src /I "%RWINC%" src\dualpass.cpp src\ssao.cpp src\post.cpp /Fe:dualpass.asi

      - uses: actions/upload-artifact@v4
        with:
          name: dualpass
          path: |
            dualpass.asi
            dualpass.ini
