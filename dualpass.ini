[DualPass]
; 1 = on, 0 = off for everything (unless overridden below)
dualPass = 1

; per-category overrides (leave out to follow dualPass)
;dualPassDefault = 1
;dualPassVehicle = 1
;dualPassPed = 1
;dualPassGrass = 1
;dualPassBuilding = 1   ; map objects (palms, fences). Set 0 if FPS drops

; alpha value (0-255) that splits the two passes. PS2 look = 128
zwriteThreshold = 128

[Extras]
; 1 = remove the clouds / gamma effect (same as SkyGfx)
disableClouds = 1
disableGamma = 1

; EXPERIMENTAL screen-edge blur (PS2-style). 0 = off (default, nothing is hooked)
; 1 = on. Runs after the game's own color filter, so colors stay the same.
blurEdges = 0
; blur strength 0-255
blurAlpha = 96
; how far the copy is shifted at each screen edge, in 1/16 pixel. Try small steps.
blurLeft = -16
blurTop = -16
blurRight = 16
blurBottom = 16

; Radiosity bloom using the GAME'S OWN radiosity code (not SkyGfx's shader version).
; -1 = leave game setting, 1 = on, 0 = off. May cost FPS and look rougher.
radiosity = -1
radiosityFilterPasses = 2
radiosityRenderPasses = 1
radiosityIntensity = 35

; Grass
; 1 = normal (game default). 0 = draw grass from both sides
grassBackfaceCull = 1
; 1 = keep grass in the same place instead of reshuffling
grassFixPlacement = 1

[AO]
; Native ambient occlusion: a port of NVIDIA HBAO+ 3.1 (same AO math, noise table and blur), no ReShade.
; Needs game antialiasing OFF. Debug log: dualpass_ssao.log in the GTA folder.
ssao = 1

; 0 = fast       (4 directions x 4 steps, half-res AO)
; 1 = HBAO+      (8 directions x 4 steps, half-res AO)  <- recommended
; 2 = HBAO+ FULL (8 directions x 4 steps at FULL resolution, exactly like the real thing, 4x the cost)
quality = 1

; ---- NVIDIA HBAO+ parameters (the defaults below ARE NVIDIA's defaults) ----
; AO radius in 1/10 game units (15 = 1.5 m). NVIDIA's default is 1.0 m
radius = 15
; overall strength in percent (100 = NVIDIA default). Multiplies both scales below
intensity = 100
; NVIDIA PowerExponent in percent (200 = 2.0, range 100-400): final AO = pow(AO, power). Higher = darker, more contrast
power = 200
; NVIDIA Bias in 1/100 (20 = 0.2, range 0-50): hides low-poly / curved-surface artifacts (NVIDIA's default is 10).
; SA's peds and cars are very low-poly, so 20 looks cleaner. Raise it if surfaces or characters look blotchy/faceted
bias = 20
; NVIDIA SmallScaleAO in percent (0-200): crisp contact darkening where things touch
smallScale = 100
; NVIDIA LargeScaleAO in percent (0-200): soft, broad shading
largeScale = 100
; NVIDIA Blur.Sharpness (0-16): higher = the blur keeps edges sharper, lower = smoother / softer AO
blurSharpness = 16
; how strictly the blur / upsample match SURFACE NORMALS (1-32). High = cleanest silhouettes (no light line along
; legs, car edges) but low-poly models can look faceted/blotchy. Low = smooth models, a faint fringe may return
normalPower = 8

; ---- performance ----
; AO smoothly fades out and is skipped beyond this distance (game units). Lower = faster
fadeDistance = 60
; cap on the AO radius in screen pixels. Lower = faster
maxRadiusPx = 48

; Frame amortisation: recompute the AO only every N frames and reuse it in between.
; 1 = EVERY frame (default, smoothest: no smearing or wobble while moving).
; 2-4 = fixed (faster, but the reused AO lags behind movement and can smear / jiggle).
; 0 = auto (every frame, every 2nd frame above ~200 FPS).
updateInterval = 1

; FPS STABILIZER. If FPS stays below this, AO quality steps down automatically
; (then AO switches off) and comes back when there is headroom. 0 = off.
; Set it to about 10 below your normal FPS (e.g. 50 if you usually get 60).
minFps = 45

; Hotkey (virtual-key code, decimal). Press it in game to cycle:
;   AO on -> AO-only view (grayscale, to check for artifacts) -> AO off
; 120 = F9, 121 = F10, 122 = F11, 145 = Scroll Lock, 19 = Pause. 0 = no hotkey
toggleKey = 120
; 1 = start in the AO-only view
debugView = 0

[Post]
; FXAA + sharpening in ONE cheap full-screen pass, after the colour filter and the AO, before the HUD
; (so HUD text stays crisp). Replaces the game's own antialiasing, which must stay OFF for the AO.
; Press toggleKey in game to switch the whole pass on/off and compare.

; 1 = SMAA (much cleaner than FXAA, still cheap). NEEDS three official files from github.com/iryoku/smaa
; copied into the src folder before building: SMAA.hlsl, Textures/AreaTex.h, Textures/SearchTex.h
; Without them the mod is built with FXAA only and falls back to FXAA automatically.
; (check dualpass_post.log in the GTA folder to see which one is really running)
smaa = 1

; 1 = FXAA on (used when SMAA is off, or when the SMAA files were not added)
fxaa = 1
; edge threshold in 1/1000 of local brightness (125 = 0.125). Lower = smooths more edges (a bit softer)
fxaaThreshold = 125

; 1 = sharpening on (CAS-style: adaptive, no halos). Counters FXAA's slight softness
sharpen = 1
; sharpening strength in percent (0-100). 20-40 looks natural
sharpenAmount = 30

; Hotkey (virtual-key code, decimal): toggles the post pass on/off. 121 = F10, 0 = no hotkey
toggleKey = 121
