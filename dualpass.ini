[DualPass]
; 1 = on, 0 = off for everything (unless overridden below)
dualPass = 1

; per-category overrides (leave out to follow dualPass)
;dualPassDefault = 1
;dualPassVehicle = 1
;dualPassPed = 1
;dualPassGrass = 1
;dualPassBuilding = 1   ; map objects (palms, fences). Set 0 if FPS drops

; alpha value (0-255) that splits the two passes. PS2 look = 128
zwriteThreshold = 250

[Extras]
; 1 = remove the clouds / gamma effect (same as SkyGfx)
disableClouds = 1
disableGamma = 1

; EXPERIMENTAL screen-edge blur (PS2-style). 0 = off (default, nothing is hooked)
; 1 = on. Runs after the game's own color filter, so colors stay the same.
blurEdges = 0
; blur strength 0-255
blurAlpha = 96
; how far the copy is shifted at each screen edge, in 1/16 pixel. Try small steps.
blurLeft = -16
blurTop = -16
blurRight = 16
blurBottom = 16

; Radiosity bloom using the GAME'S OWN radiosity code (not SkyGfx's shader version).
; -1 = leave game setting, 1 = on, 0 = off. May cost FPS and look rougher.
radiosity = -1
radiosityFilterPasses = 2
radiosityRenderPasses = 1
radiosityIntensity = 35

; Grass
; 1 = normal (game default). 0 = draw grass from both sides
grassBackfaceCull = 1
; 1 = keep grass in the same place instead of reshuffling
grassFixPlacement = 1

[AO]
; Native ambient occlusion: a port of NVIDIA HBAO+ 3.1 (same AO math, noise table and blur), no ReShade.
; Needs game antialiasing OFF. Debug log: dualpass_ssao.log in the GTA folder.
ssao = 1

; 0 = fast       (4 directions x 4 steps, half-res AO)
; 1 = HBAO+      (8 directions x 4 steps, half-res AO)  <- recommended
; 2 = HBAO+ FULL (8 directions x 4 steps at FULL resolution, exactly like the real thing, 4x the cost)
quality = 2

; ---- NVIDIA HBAO+ parameters (the defaults below ARE NVIDIA's defaults) ----
; AO radius in 1/10 game units (15 = 1.5 m). NVIDIA's default is 1.0 m
radius = 15
; overall strength in percent (100 = NVIDIA default). Multiplies both scales below
intensity = 100
; NVIDIA PowerExponent in percent (200 = 2.0, range 100-400): final AO = pow(AO, power). Higher = darker, more contrast
power = 170
; NVIDIA Bias in 1/100 (10 = 0.1, range 0-50): hides low-poly / curved-surface artifacts. Raise it if flat surfaces look dirty
bias = 10
; NVIDIA SmallScaleAO in percent (0-200): crisp contact darkening where things touch
smallScale = 100
; NVIDIA LargeScaleAO in percent (0-200): soft, broad shading
largeScale = 80
; NVIDIA Blur.Sharpness (0-16): higher = the blur keeps edges sharper, lower = smoother / softer AO
blurSharpness = 0
; how strictly the blur / upsample match SURFACE NORMALS (1-32). High = cleanest silhouettes (no light line along
; legs, car edges) but low-poly models can look faceted/blotchy. Low = smooth models, a faint fringe may return
normalPower = 8

; ---- performance ----
; AO smoothly fades out and is skipped beyond this distance (game units). Lower = faster
fadeDistance = 60
; cap on the AO radius in screen pixels. Lower = faster
maxRadiusPx = 48

; Frame amortisation: recompute the AO only every N frames and reuse it in between.
; 1 = EVERY frame (default, smoothest: no smearing or wobble while moving).
; 2-4 = fixed (faster, but the reused AO lags behind movement and can smear / jiggle).
; 0 = auto (every frame, every 2nd frame above ~200 FPS).
updateInterval = 1

; FPS STABILIZER. If FPS stays below this, AO quality steps down automatically
; (then AO switches off) and comes back when there is headroom. 0 = off.
; Set it to about 10 below your normal FPS (e.g. 50 if you usually get 60).
minFps = 45

; Hotkey (virtual-key code, decimal). Press it in game to cycle:
;   AO on -> AO-only view (grayscale, to check for artifacts) -> AO off
; 120 = F9, 121 = F10, 122 = F11, 145 = Scroll Lock, 19 = Pause. 0 = no hotkey
toggleKey = 120
; 1 = start in the AO-only view
debugView = 0

[Post]
; FXAA + sharpening in ONE cheap full-screen pass, after the colour filter and the AO, before the HUD
; (so HUD text stays crisp). Replaces the game's own antialiasing, which must stay OFF for the AO.
; Press toggleKey in game to switch the whole pass on/off and compare.

; 1 = SMAA (much cleaner than FXAA, still cheap). NEEDS three official files from github.com/iryoku/smaa
; copied into the src folder before building: SMAA.hlsl, Textures/AreaTex.h, Textures/SearchTex.h
; Without them the mod is built with FXAA only and falls back to FXAA automatically.
; (check dualpass_post.log in the GTA folder to see which one is really running)
smaa = 1

; 1 = FXAA on (used when SMAA is off, or when the SMAA files were not added)
fxaa = 1
; edge threshold in 1/1000 of local brightness (125 = 0.125). Lower = smooths more edges (a bit softer)
fxaaThreshold = 125

; 1 = sharpening on (CAS-style: adaptive, no halos). Counters FXAA's slight softness
sharpen = 0
; sharpening strength in percent (0-100). 20-40 looks natural
sharpenAmount = 0

; Hotkey (virtual-key code, decimal): toggles the post pass on/off. 121 = F10, 0 = no hotkey
toggleKey = 121

[Atmosphere]
; Depth fog + bloom in ONE extra screen-space pass, after the AO and before the AA pass.
; Everything follows the game's live timecyc (fog colour = sky colour, day/night = sky brightness, sun colour),
; so it works with any timecyc mod. Log: dualpass_atmos.log in the GTA folder.
; Fog needs the AO module (ssao = 1, it provides the depth buffer). Bloom works without it.
; Press toggleKey in game to switch the whole pass on/off and compare.
atmosphere = 1

; hotkey (virtual-key code, decimal): 122 = F11, 0 = none
toggleKey = 122

; ---------------- fog (classic San Andreas haze) ----------------
fog = 1
; strength in percent (0-100). The haze colour is the timecyc sky colour, so it matches the sky
fogStrength = 50
; where the haze begins, in percent of the timecyc fog start distance
fogStart = 90
; where it reaches full strength, in percent of the timecyc far clip
fogEnd = 100
; x100: 100 = linear. 150-250 = the haze gathers in the distance and keeps the near scenery clear
fogCurve = 220
; percent: warm glow of the haze on the sun side (sunset / sunrise)
sunScatter = 25

; ---------------- bloom (lit windows, street lights, headlights, sirens, the sun) ----------------
bloom = 1
; percent (lower = subtler)
bloomIntensity = 35
; percent of the bloom intensity used in full daylight. Low = bloom is mostly a night effect (lit windows, lamps)
bloomDay = 40

; how bright a pixel must be to glow, 0-100. Day is higher so only the really bright things glow.
; The sky itself never blooms.
bloomThresholdDay = 90
; at night the threshold is lower so lit windows, lamps, headlights and siren lights glow
bloomThresholdNight = 50
; extra intensity at night, percent
bloomNightBoost = 80
; size of the glow in percent
bloomSize = 100

log = 1

[FluffyClouds]
; Fluffy Clouds (GTA3/VC style cloud sprites, port of fluffyclouds-sa) built into DualPass.
; Copy resources\fluffycloudsSA.txd to <GTA>\models\  (the folder that has player.img etc.).
; Do NOT run it together with the standalone FluffyCloudsSA.asi.
; Works with any timecyc mod: colours, sun colour, sky colour and time of day all come from the game's CURRENT
; timecyc, so vanilla, 24h and custom timecycs work and the clouds follow time of day + weather.
; Debug log: dualpass_clouds.log in the GTA folder.
fluffyClouds = 1

; ---------------- basic look ----------------
; cloud alpha 0-255 in daylight (original = 160). Faded out automatically in foggy weather
alpha = 100

; brightness of the cloud colour in percent (100 = exactly the timecyc colour, 120 = brighter)
brightness = 100

; blend the cloud colour towards white in daylight, 0-100. 0 = exactly the timecyc colour.
; Many timecyc mods give the fluffy-clouds column a dark/brown colour. Try 25-60 for lighter clouds.
whiten = 0

; how far out the cloud ring sits, in percent. 100 = original (about 200 units around you, close).
; 300-500 pushes the clouds out towards the horizon (limited by the game's draw distance).
distance = 200

; cloud size in percent (100 = original)
size = 70

; base height of the cloud layer in game units (original = 50)
height = 100

; ---------------- motion (new) ----------------
; cloud drift speed in percent (100 = about 4 game units per second). Values below 0 count as 0 = no drift.
; (your old value -1 meant "no drift", it is now 100 so the new wind is visible)
windSpeed = 100

; 1 = REAL WIND: clouds drift across the sky in one direction, fade out at the far edge and re-appear faded-in
;     on the other side, so the sky never empties. 0 = the original mod (the whole ring rotates around you)
windMode = 1

; world direction the clouds drift towards, in degrees (0 = east, 90 = north)
windDirection = 40

; how much of YOUR movement shifts the clouds, percent. 0 = painted on the sky, 3-5 = subtle depth when driving
parallax = 3

; clouds form and dissolve: average seconds a cloud lives before it fades out and re-forms somewhere else.
; 0 = clouds never change. 60 = fast, 150 = calm, 400 = very slow
lifespan = 150

; 1 = fade the clouds out when the camera is far above the layer (planes, jetpack). 0 = always visible
fadeAtHeight = 0

; keeps the whole cloud layer at least this many game units ABOVE the camera (0 = off).
; Fixes giant blobs around the lens when the camera is high: spawn screen, rooftops, hills, planes
minClearance = 40

; clouds closer to the camera than about this distance fade out (game units, 0 = off)
nearFade = 120

; ---------------- lighting (new) ----------------
; 1 = clouds are lit by the sun: the side facing the sun takes the SUN'S colour (orange at sunset, pale yellow
; at noon), the far side and the underside are darker, plus an additive glow on clouds near the sun
highlight = 1

; strength of the sun-coloured lighting, percent (0 = none, 200 = strong)
sunGlow = 130

; top-lit / dark-underside contrast of each cloud, 0-100. 0 = flat colour like the original mod
shading = 100

; ---------------- horizon fade (new) ----------------
; 0-100. Clouds near the horizon get fainter and blend into the sky colour instead of ending in a hard
; smoky edge. 0 = off
horizonFade = 70

; ---------------- variety (new) ----------------
; 0-100. Random per-session jitter of cloud positions, sizes, rotation and alpha, so the sky is not the
; same fixed pattern every time. 0 = exactly the original layout
variety = 60

; ---------------- second layer (new) ----------------
; 1 = adds a second cloud layer: higher, further away, slower and softer
layer2 = 1
; number of sprites in the second layer (0-48)
layer2Count = 28
; alpha of the second layer in percent of the main alpha
layer2Alpha = 70
; how many game units above the main layer
layer2Height = 90
; distance of the second layer in percent of the main ring distance
layer2Distance = 160
; drift speed of the second layer in percent of the main layer (needs windSpeed above 0 to move)
layer2Speed = 60

; ---------------- night (new) ----------------
; how visible the clouds are at night (0-255), how dark (percent), and how much cool moonlit blue-grey (0-100)
nightAlpha = 90
nightBrightness = 70
nightTint = 45

; ---------------- transitions (new) ----------------
; fade time in milliseconds when entering / leaving interiors (0 = instant on/off)
fadeTime = 1500

; milliseconds over which sudden changes are eased: server time jumps, weather changes, timecyc swaps
; (0 = instant)
smoothing = 1000

; ---------------- advanced ----------------
; byte offset of the "fluffy clouds bottom RGB" values inside the game's CURRENT timecyc colour set.
; -1 = built-in default (confirmed correct by your log dump)
colorOffset = -1
; used only when that colour cannot be read
fallbackR = 235
fallbackG = 235
fallbackB = 240
; 1 = write dualpass_clouds.log
log = 1
