[DualPass]
; 1 = on, 0 = off for everything (unless overridden below)
dualPass = 1

; per-category overrides (leave out to follow dualPass)
;dualPassDefault = 1
;dualPassVehicle = 1
;dualPassPed = 1
;dualPassGrass = 1
;dualPassBuilding = 1   ; map objects (palms, fences). Set 0 if FPS drops

; alpha value (0-255) that splits the two passes. PS2 look = 128
zwriteThreshold = 250

[AO]
; Native ambient occlusion: a port of NVIDIA HBAO+ 3.1 (same AO math, noise table and blur), no ReShade.
; Needs game antialiasing OFF. Debug log: dualpass_ssao.log in the GTA folder.
ssao = 1

; 0 = fast       (4 directions x 4 steps, half-res AO)
; 1 = HBAO+      (8 directions x 4 steps, half-res AO)  <- recommended
; 2 = HBAO+ FULL (8 directions x 4 steps at FULL resolution, exactly like the real thing, 4x the cost)
quality = 0

; ---- NVIDIA HBAO+ parameters (the defaults below ARE NVIDIA's defaults) ----
; AO radius in 1/10 game units (15 = 1.5 m). NVIDIA's default is 1.0 m
radius = 10
; overall strength in percent (100 = NVIDIA default). Multiplies both scales below
intensity = 100
; NVIDIA PowerExponent in percent (200 = 2.0, range 100-400): final AO = pow(AO, power). Higher = darker, more contrast
power = 170
; NVIDIA Bias in 1/100 (10 = 0.1, range 0-50): hides low-poly / curved-surface artifacts. Raise it if flat surfaces look dirty
bias = 10
; NVIDIA SmallScaleAO in percent (0-200): crisp contact darkening where things touch
smallScale = 100
; NVIDIA LargeScaleAO in percent (0-200): soft, broad shading
largeScale = 80
; NVIDIA Blur.Sharpness (0-16): higher = the blur keeps edges sharper, lower = smoother / softer AO
blurSharpness = 0
; how strictly the blur / upsample match SURFACE NORMALS (1-32). High = cleanest silhouettes (no light line along
; legs, car edges) but low-poly models can look faceted/blotchy. Low = smooth models, a faint fringe may return
normalPower = 8

; ---- performance ----
; AO smoothly fades out and is skipped beyond this distance (game units). Lower = faster
fadeDistance = 35
; cap on the AO radius in screen pixels. Lower = faster
maxRadiusPx = 16

; Frame amortisation: recompute the AO only every N frames and reuse it in between.
; 1 = EVERY frame (default, smoothest: no smearing or wobble while moving).
; 2-4 = fixed (faster, but the reused AO lags behind movement and can smear / jiggle).
; 0 = auto (every frame, every 2nd frame above ~200 FPS).
updateInterval = 0

; FPS STABILIZER. If FPS stays below this, AO quality steps down automatically
; (then AO switches off) and comes back when there is headroom. 0 = off.
; Set it to about 10 below your normal FPS (e.g. 50 if you usually get 60).
minFps = 0

; Hotkey (virtual-key code, decimal). Press it in game to cycle:
;   AO on -> AO-only view (grayscale, to check for artifacts) -> AO off
; 120 = F9, 121 = F10, 122 = F11, 145 = Scroll Lock, 19 = Pause. 0 = no hotkey
toggleKey = 120
; 1 = start in the AO-only view
debugView = 0

[Post]
; SMAA 1x (3 passes), after the colour filter and the AO, before the HUD.
; NEEDS three official files from github.com/iryoku/smaa copied into src\ before building:
; SMAA.hlsl, Textures/AreaTex.h, Textures/SearchTex.h   (check dualpass_post.log in the GTA folder)
smaa = 0

; Hotkey (virtual-key code, decimal): toggles SMAA on/off. 121 = F10, 0 = no hotkey
toggleKey = 121
